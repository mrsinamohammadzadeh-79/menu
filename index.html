<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3efe6" />
    <meta name="description" content="منوی دیجیتال ولوریا — کیک و کوکی. دسرهای دست‌ساز و تازه." />
    <link rel="icon" type="image/png" href="axx/logo3.png" />
    <title>Velouria — Cake &amp; Cookie</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="loading">
    <!-- ===== پرده لودینگ ===== -->
    <div id="loader" class="loader" aria-hidden="true">
      <div class="loader-inner">
        <div class="loader-logo">
          <span class="loader-ring loader-ring-1"></span>
          <span class="loader-ring loader-ring-2"></span>
          <span class="loader-glow"></span>
          <span class="loader-spark s1">✦</span>
          <span class="loader-spark s2">✦</span>
          <span class="loader-spark s3">✦</span>
          <img src="axx/logo3.png" alt="Velouria" class="loader-img" />
          <span class="loader-sweep"></span>
        </div>
        <div class="loader-brand">VELOURIA</div>
        <p class="loader-sub">CAKE &amp; COOKIE</p>
        <div class="loader-bar"><span class="loader-bar-fill"></span></div>
        <p class="loader-wait">لطفا منتظر بمانید<span class="loader-dots"><span>.</span><span>.</span><span>.</span></span></p>
      </div>
    </div>

    <!-- ===== هدر ===== -->
<header class="site-header">
      <div class="header-inner">
        <div class="header-action">
          <button id="socialBtn" class="icon-btn" type="button" aria-label="شبکه‌های اجتماعی" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="icon">
              <path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z" />
            </svg>
          </button>
          <div id="socialPanel" class="social-panel"></div>
        </div>

        <button id="menuBtn" class="icon-btn" type="button" aria-label="باز کردن منو">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" class="icon">
            <path d="M5.5 8h13" />
            <path d="M5.5 12h13" />
            <path d="M5.5 16h13" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <div class="brand-banner">
        <a class="brand brand-main" href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">
          <img id="logoImg" src="axx/logo3.png" alt="Velouria" class="brand-logo" />
        </a>
        <p class="site-slogan">
          <span class="slogan-line">taste of love</span>
          <span class="slogan-line slogan-accent">in every slice</span>
        </p>
        <p class="site-slogan-fa">
          <span class="slogan-line-fa">هر شیرینی،</span>
          <span class="slogan-line-fa slogan-accent">یک خاطره شیرین</span>
        </p>
      </div>

      <!-- ===== خوش‌آمدگویی ===== -->
      <section class="hero" aria-label="خوش‌آمدگویی">
        <h1 class="hero-title">سلام!</h1>
        <p class="hero-sub">امروز چی میل دارین؟</p>
        <div class="hero-divider" aria-hidden="true">
          <span class="line"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="heart">
            <path d="M12 21C7 16.5 3 13.2 3 9.6 3 7.1 4.9 5 7.4 5c1.8 0 3.4 1 4.6 2.6C13.2 6 14.8 5 16.6 5 19.1 5 21 7.1 21 9.6c0 3.6-4 6.9-9 11.4z" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="line"></span>
        </div>
        <p class="hero-brand-en">VELOURIA · CAKE &amp; COOKIE</p>
      </section>

      <!-- ===== کارت‌های دسته‌بندی ===== -->
      <section id="categorySection" class="section section-cards"></section>

      <!-- ===== نوار دسته‌بندی جمع‌وجور (بعد از انتخاب) ===== -->
      <div id="categoryStrip" class="cat-strip hidden"></div>

      <!-- ===== محصولات ===== -->
      <section id="productSection" class="section product-section hidden"></section>
    </main>

    <!-- ===== فوتر ===== -->
    <footer class="site-footer">
      <div class="footer-inner">
        <a class="footer-brand" href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">
          <img src="axx/logo3.png" alt="Velouria" class="footer-logo" />
          <span class="footer-brand-en">VELOURIA · CAKE &amp; COOKIE</span>
        </a>
        <nav class="footer-social" aria-label="شبکه‌های اجتماعی"></nav>
        <p class="footer-note"></p>
        <p class="footer-copy">© ولوریا — با عشق پخته می‌شود</p>
      </div>
    </footer>

    <!-- ===== منوی کشویی ===== -->
    <div id="drawer" class="drawer" aria-hidden="true">
      <div class="drawer-overlay" data-close-drawer></div>
      <aside class="drawer-panel">
        <div class="drawer-head">
          <img src="axx/logo3.png" alt="Velouria" class="drawer-logo" />
          <button id="drawerClose" class="icon-btn" type="button" aria-label="بستن">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" class="icon">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <nav class="drawer-nav" aria-label="دسته‌ها"></nav>
        <div class="drawer-foot">
          <p class="drawer-brand-en">VELOURIA</p>
          <p class="drawer-brand-sub">CAKE &amp; COOKIE</p>
        </div>
      </aside>
    </div>

    <!-- ===== انتخاب دسته (همبرگر موبایل) ===== -->
    <div id="categorySheet" class="cat-sheet" aria-hidden="true">
      <div class="cat-sheet-overlay" data-close-catsheet></div>
      <div class="cat-sheet-panel" role="dialog" aria-modal="true" aria-label="انتخاب دسته">
        <div class="cat-sheet-head">
          <p class="cat-sheet-title">انتخاب دسته</p>
          <button id="catSheetClose" class="icon-btn" type="button" aria-label="بستن">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" class="icon">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <div id="categorySheetList" class="cat-list"></div>
      </div>
    </div>

    <!-- ===== مودال محصول ===== -->
    <div id="modal" class="modal" aria-hidden="true">
      <div class="modal-overlay" data-close-modal></div>
      <div id="modalSheet" class="modal-sheet" role="dialog" aria-modal="true"></div>
    </div>

    <!-- ===== توست ===== -->
    <div id="toast" class="toast" role="status"></div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
